# Side-by-side definitions. Every definition used on the site lists at least one series_id.
# Wording is taken from docs/sources/*.md; do not add scope claims the sources do not support.

- id: welfare_dwp_ame
  label: DWP benefit spending (AME)
  short: "Benefits paid by the Department for Work and Pensions, as set out in its own spending table"
  includes: [State Pension, Universal Credit, PIP, Housing Benefit]
  excludes: [Tax credits (HMRC, pre-UC), departmental admin]
  source_id: dwp_benefits
  series_ids: [dwp_benefits.exp.total_benefit_expenditure]
  notes: "DWP Table 1a (nominal expenditure by benefit). Geography as stated in the table."

- id: welfare_cap
  label: Welfare Cap
  short: "A government limit on welfare spending that leaves out the State Pension and the benefits that rise and fall most with the economy, but adds some spending from other departments and Northern Ireland"
  includes: [Some non-DWP welfare spending, Northern Ireland]
  excludes: [State Pension, JSA and the UC equivalent (cyclical)]
  source_id: dwp_benefits
  series_ids: [dwp_benefits.uk_welfare.total.within_the_welfare_cap]
  notes: "Use for fiscal-rule purposes only; not a total of what is spent on welfare."

- id: uk_welfare_total
  label: UK welfare (DWP tab)
  short: "A wider welfare total, taken from the tab labelled UK welfare in the Department for Work and Pensions tables"
  includes: [Benefits shown on the UK welfare tab]
  excludes: []
  source_id: dwp_benefits
  series_ids: [dwp_benefits.total_uk_welfare]
  notes: "GB welfare is a separate tab; the parser records which geography each series uses."

- id: cofog_social_protection
  label: COFOG social protection (function 10)
  short: "Spending on pensions, benefits and other support, grouped by an international system that sorts spending by purpose"
  includes: [COFOG function 10]
  excludes: []
  source_id: pesa
  series_ids: [pesa.cofog.social_protection]
  notes: "Scope differs from DWP welfare; the site shows both. COFOG tables are TES, not TME."

- id: tme
  label: Total managed expenditure (TME)
  short: "All public spending: what departments plan to spend plus spending that depends on need, such as benefits"
  includes: [DEL, AME]
  excludes: []
  source_id: pesa
  series_ids: [pesa.tme, obr.tme]
  notes: "PESA Table 4.1 (£bn) and OBR databank; vintages differ (PESA July, OBR Sept)."

- id: tes
  label: Total expenditure on services (TES)
  short: "Spending grouped by what it is for; it differs from total government spending by some accounting adjustments"
  includes: [COFOG functions]
  excludes: [Accounting adjustments between TES and TME]
  source_id: pesa
  series_ids: [pesa.tes]
  notes: "TME = TES + accounting adjustments."

- id: public_sector_current_receipts
  label: Public sector current receipts
  short: "All the money the public sector takes in, including items that HM Revenue and Customs does not collect"
  includes: [Taxes, NICs, council tax, business rates, other receipts]
  excludes: []
  source_id: obr
  series_ids: [obr.receipts]
  notes: "Wider than HMRC receipts."

- id: hmrc_receipts
  label: HMRC tax and NICs receipts
  short: "Tax and National Insurance collected by HM Revenue and Customs"
  includes: [Income tax, NICs, VAT, Corporation tax, other HMRC taxes]
  excludes: [Council tax, business rates, other non-HMRC receipts]
  source_id: hmrc_receipts
  series_ids: [hmrc_receipts.total]
  notes: "Receipts only, not welfare."

- id: income_tax_liabilities
  label: Income tax liabilities
  short: "Income tax owed, shown by tax year and income range; National Insurance is not included"
  includes: [Income tax]
  excludes: [NICs, welfare]
  source_id: hmrc_income_tax
  series_ids: [hmrc_income_tax.liabilities_total]
  notes: "Tax years, not fiscal years. 2023-24 onward in the current edition."

- id: central_govt_tme
  label: Central government total managed expenditure (ONS)
  short: "What central government spends, net of some receipts, on the ONS definition; local government is not included"
  includes: [Central government current and capital spending on the ONS TME basis]
  excludes: [Local government, public corporations]
  source_id: ons_psf
  series_ids: [ons_psf.cg_tme]
  notes: "Narrower than PESA and OBR public sector TME, and a different basis from gross central government expenditure. Never mixed with them."

- id: central_govt_gross_expenditure
  label: Central government total expenditure, gross (ONS)
  short: "Everything central government pays out, before netting off any receipts"
  includes: [Central government current and capital spending, gross]
  excludes: [Local government, public corporations]
  source_id: ons_psf
  series_ids: [ons_psf.cg_total_expenditure_gross]
  notes: "Gross expenditure minus receipts equals net borrowing. Differs from cg_tme."

- id: central_govt_debt_interest
  label: Central government debt interest
  short: "Interest the government pays on what it has borrowed"
  includes: [Interest on gilts and other central government debt]
  excludes: [Repayment of the debt itself]
  source_id: ons_psf
  series_ids: [ons_psf.cg_debt_interest]
  notes: "Shown as a share of central government receipts (out of every 100 pounds received)."

- id: pesa_uk_services
  label: UK total expenditure on services (PESA Table 5.2)
  short: "UK public spending on services, split by function, before accounting adjustments"
  includes: [The ten COFOG functions, EU transactions]
  excludes: [Accounting adjustments]
  source_id: pesa_uk
  series_ids: [pesa_uk.services]
  notes: "Services plus accounting adjustments equals TME. UK-wide, replacing the England-only chapter 10 split."

- id: pesa_uk_tme
  label: UK total managed expenditure (PESA Table 5.2)
  short: "All UK public sector spending, on the PESA definition"
  includes: [Services, accounting adjustments]
  excludes: []
  source_id: pesa_uk
  series_ids: [pesa_uk.tme]
  notes: "Agrees with PESA Table 4.1 TME in the same edition."

- id: households
  label: Households (ONS Labour Force Survey)
  short: "The number of households in the UK, used to show spending per household"
  includes: [UK private households, April to June quarter]
  excludes: []
  source_id: ons_households
  series_ids: [ons_households.uk]
  notes: "Private households only; a Labour Force Survey sample estimate, not a census count. Calendar-year April to June figure matched to the fiscal year that contains it; spending covers the whole fiscal year."

- id: nominal_gdp_calendar
  label: Nominal GDP, calendar year (ONS)
  short: "The size of the UK economy in cash terms, by calendar year"
  includes: [GDP at current market prices]
  excludes: []
  source_id: ons_gdp
  series_ids: [ons_gdp.nominal]
  notes: "Calendar years do not line up with fiscal years, so it is not used for percent-of-GDP; the OBR fiscal-year GDP is used there."

- id: fcdo_idrc
  group: [immigration, "Immigration: money in and money out"]
  label: In-donor refugee costs (FCDO)
  short: "What the UK spends at home on people seeking protection in their first year here, as counted for UK aid"
  publisher: Foreign, Commonwealth and Development Office
  includes: [Support for asylum seekers and refugees from aid-eligible countries during the first 12 months of their stay, Spending by the Home Office and other departments, Estimated devolved health and education costs]
  excludes: [Costs after the first 12 months, People from countries that are not aid-eligible, Spending not counted as aid]
  source_id: fcdo_oda
  series_ids: [fcdo_oda.idrc.total, fcdo_oda.idrc.home_office, fcdo_oda.idrc.dhsc, fcdo_oda.idrc.dfe, fcdo_oda.idrc.mhclg, fcdo_oda.idrc.dwp, fcdo_oda.idrc.hmrc, fcdo_oda.idrc.other]
  notes: "Calendar year (January to December), not financial year. Provisional: the final release for the year is due in autumn 2026. Departments' figures may not add to the total because of rounding. This is the only cross-department series on this subject that the official sources publish."

- id: home_office_resource_del
  group: [immigration, "Immigration: money in and money out"]
  label: Home Office day-to-day spending by area (Core Data Tables)
  short: "What the Home Office spent on day-to-day running costs in the areas shown, after fee income is taken off"
  publisher: Home Office
  includes: [Resource (day-to-day) spending within the Home Office budget limit, Actual figures for 2021-22 to 2025-26]
  excludes: [Capital spending, Spending by other departments or local authorities, Plans for future years]
  source_id: home_office_spend
  series_ids: [home_office_spend.resource_del.asylum_support_resettlement_accommodation, home_office_spend.resource_del.customer_services_visas_passports, home_office_spend.resource_del.immigration_enforcement, home_office_spend.resource_del.border_force, home_office_spend.resource_del.total]
  notes: "The Customer Services line (visas and passports) is negative because fee income is taken off the cost, so it shows income above cost. The file name says 'draft', so check against the Annual Report and Accounts. Group names change from year to year, so a line is shown only for the years it appears under that name. Asylum hotels are not a separate line."

- id: home_office_ara_income
  group: [immigration, "Immigration: money in and money out"]
  label: Home Office income from visas, health surcharge, skills charge and penalties (Annual Report and Accounts)
  short: "Money the Home Office recorded as income from fees, charges and penalties, taken from its audited accounts for 2025-26 with the year before for comparison"
  publisher: Home Office
  includes: [Visa and immigration fee income, Immigration Health Surcharge kept in the Home Office accounts, Immigration Health Surcharge paid straight to the Consolidated Fund, UK Visas and Immigration income and full cost from the fees and charges table, Immigration Skills Charge, Civil penalties, Total revenue in the Trust Statement]
  excludes: [Passport fees (except consular passport fees inside the Trust Statement total), Tax paid by migrants, Benefits or NHS costs, Income by type of visa, Years before 2024-25]
  source_id: home_office_ara
  series_ids: [home_office_ara.visa_income, home_office_ara.ihs_retained, home_office_ara.ihs_payable_consolidated_fund, home_office_ara.ukvi_fee_income, home_office_ara.ukvi_full_cost, home_office_ara.ukvi_surplus, home_office_ara.immigration_skills_charge, home_office_ara.civil_penalties, home_office_ara.trust_total_revenue]
  notes: "Financial years (April to March). Read from the PDF by a fixed-page program, with the page and row recorded on every figure. The 2024-25 figures are comparatives printed in the 2025-26 report; the Trust Statement says its 2024-25 column is reclassified (discounts policy) and the narrative calls it restated. The Immigration Health Surcharge is passed on to health services in the four nations, so it is income to the Home Office accounts and not a measure of NHS cost; the retained part is in Note 3 and the part paid straight to the Consolidated Fund is shown separately (a dash, read as nil, in 2025-26). The report also says that refunds for an Immigration Health Surcharge scheme error are taken off the retained income. The fees and charges table (UKVI) and Note 3 visa income describe the same fees on slightly different bases, so they differ by a few thousand pounds. Trust Statement revenue is before costs of collection and credit losses (gross)."

- id: dwp_uc_by_status
  group: [immigration, "Immigration: money in and money out"]
  label: People on Universal Credit by immigration status (DWP)
  short: "How many people get Universal Credit, split by the immigration status DWP holds for them"
  publisher: Department for Work and Pensions
  includes: [People on Universal Credit in Great Britain in May of each year, Status from the Habitual Residence Test record]
  excludes: [Pounds paid, Other benefits, Northern Ireland, Asylum seekers and people with no recourse to public funds (they cannot claim)]
  source_id: dwp_uc_status
  series_ids: [dwp_uc_status.people.cta, dwp_uc_status.people.eu_settlement_scheme, dwp_uc_status.people.humanitarian, dwp_uc_status.people.refugee, dwp_uc_status.people.indefinite_leave_to_remain, dwp_uc_status.people.limited_leave_to_remain, dwp_uc_status.people.other, dwp_uc_status.people.no_status_recorded]
  notes: "Counts of people, not pounds. The latest three months of each release are provisional. 'No immigration status recorded' is a data category and does not mean a person is here without permission. Numbers have small random adjustments to protect privacy, so parts may not add up to a total."

- id: home_office_asylum_counts
  group: [immigration, "Immigration: money in and money out"]
  label: People claiming asylum and people in asylum support (Home Office)
  short: "How many people claim asylum, wait for a decision, get Home Office housing and support, and live in hotels"
  publisher: Home Office
  includes: [Asylum seekers in receipt of Home Office support at the end of each calendar year, Those of them housed in hotels]
  excludes: [Pounds spent, People supported by other routes, Figures for the year ending June 2026 (not included here)]
  source_id: home_office_asylum
  series_ids: [home_office_asylum.claims, home_office_asylum.awaiting_decision, home_office_asylum.support, home_office_asylum.support_hotels]
  notes: "Counts of people, not pounds. Hotel counts are published from 2022. The Home Office accounts have no separate pounds figure for hotels. Figures are revised every quarter."
