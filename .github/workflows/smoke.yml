name: Smoke test (live site)

on:
  workflow_run:
    workflows: ["Refresh data"]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    # only after a successful refresh (or when run by hand)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - name: Smoke test the deployed site
        run: |
          SMOKE_URL="https://${REPO%%/*}.github.io/${REPO##*/}/" PYTHONPATH=src uv run --locked pytest tests/smoke -q
